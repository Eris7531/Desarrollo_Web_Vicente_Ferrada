<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de miembros</title>
    <link rel="stylesheet" type="text/css" href="./styles.css">
</head>
<body>
    <div class="main-container main-container--wide">
        <header class="list-header">
            <h1>Miembros registrados y sus actividades</h1>
        </header>

        <section class="controls-panel" aria-label="Filtros y orden">
            <div class="control-row">
                <label for="filter-tipo">Filtrar por tipo de miembro</label>
                <select id="filter-tipo">
                    <option value="">Todos</option>
                    <option value="Académico (Estudiante)">Académico (Estudiante)</option>
                    <option value="Funcionario">Funcionario</option>
                </select>
            </div>
            <div class="control-row">
                <label for="sort-by">Ordenar por</label>
                <select id="sort-by">
                    <option value="nombre-asc">Nombre (A–Z)</option>
                    <option value="nombre-desc">Nombre (Z–A)</option>
                    <option value="email-asc">Correo (A–Z)</option>
                    <option value="email-desc">Correo (Z–A)</option>
                    <option value="telefono-asc">Teléfono (menor a mayor)</option>
                    <option value="telefono-desc">Teléfono (mayor a menor)</option>
                </select>
            </div>
            <div class="control-row control-row--narrow">
                <label for="page-size">Filas por página</label>
                <select id="page-size">
                    <option value="3">3</option>
                    <option value="5" selected>5</option>
                    <option value="10">10</option>
                </select>
            </div>
        </section>

        <div class="table-wrap">
            <table class="data-table">
                <caption class="sr-only">Listado de miembros con correo, teléfono, tipo y actividades informadas</caption>
                <thead>
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Correo</th>
                        <th scope="col">Teléfono (+56)</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Actividades</th>
                    </tr>
                </thead>
                <tbody id="members-tbody"></tbody>
            </table>
        </div>

        <nav class="pagination" aria-label="Paginación">
            <button type="button" id="btn-prev" class="nav-btn nav-btn--small">Anterior</button>
            <span id="page-info" class="page-info"></span>
            <button type="button" id="btn-next" class="nav-btn nav-btn--small">Siguiente</button>
        </nav>

        <nav class="navigation-container list-footer-nav">
            <button type="button" class="nav-btn" onclick="window.location.href='HomePage.html'">Volver al inicio</button>
        </nav>
    </div>
    <script src="./js/memberList.js"></script>
</body>
</html>
