spring.application.name=tarea4spring
server.port=8080
server.address=0.0.0.0

# Puerto de Flask en la misma máquina (host se detecta automáticamente por petición).
app.flask-port=5000
# Opcional: fijar host si la detección automática no aplica (ej. app.flask-host=192.168.1.10)
app.flask-host=

spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=cc5002
spring.datasource.password=programacionweb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
